name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch: # permite rodar manualmente pela aba Actions

permissions:
  contents: write # necessário para publicar a Release com o APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Instala o Gradle na versão exigida pelo plugin do Android (sem precisar do gradlew)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gerar APK assinado (release)
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Nomear o APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "YourLife-1.0.${{ github.run_number }}.apk"

      - name: Guardar APK como artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: your-life-apk
          path: YourLife-1.0.${{ github.run_number }}.apk

      # Cria uma Release com link direto para baixar o APK (na aba Releases do repositório)
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" "YourLife-1.0.${{ github.run_number }}.apk" \
            --title "Your Life 1.0.${{ github.run_number }}" \
            --notes "APK assinado. Baixe o arquivo abaixo no celular e toque para instalar. Versões novas atualizam a anterior." \
            --latest
